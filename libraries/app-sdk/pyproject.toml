[project]
name = "our-ark-app-sdk"
version = "0.1.0"
description = "App-hosted message and context contracts for personal agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
our_ark_app_sdk = ["static/*.js", "static/*.css"]
