[project]
name = "our-ark-app-sdk"
version = "0.1.0"
description = "UAAP reference app SDK for personal-agent message delivery and context exchange"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/our-ark/ruth"
Documentation = "https://github.com/our-ark/ruth/tree/main/libraries/app-sdk"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
our_ark_app_sdk = ["static/*.js", "static/*.css"]
